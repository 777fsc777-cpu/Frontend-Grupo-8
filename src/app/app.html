<mat-sidenav-container class="app-shell">
  <mat-sidenav class="sidebar" mode="side" opened fixedInViewport>
    <div class="brand-block">
      <div class="brand-mark">
        <mat-icon>home_work</mat-icon>
      </div>
      <div>
        <p class="brand-kicker">SmartRent</p>
        <h1>Grupo ochito</h1>
      </div>
    </div>

    <mat-nav-list class="side-nav">
      @for (item of navItems; track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: item.route === '/' }"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="main-shell">
    <mat-toolbar class="topbar">
      <div>
        <span class="topbar-label">Sistema de gestion</span>
        <strong>SmartRent</strong>
      </div>
      <button mat-flat-button color="primary" routerLink="/estates/list">
        <mat-icon>apartment</mat-icon>
        Inmuebles
      </button>
    </mat-toolbar>

    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
