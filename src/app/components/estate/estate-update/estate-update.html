<h1>Actualizar inmueble</h1>

<form #estateForm="ngForm" (ngSubmit)="aceptar()">
  <mat-form-field appearance="outline">
    <mat-label>Título</mat-label>
    <input matInput name="title" [(ngModel)]="estate.title" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Descripción</mat-label>
    <textarea matInput name="description" [(ngModel)]="estate.description" required></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Dirección</mat-label>
    <input matInput name="adress" [(ngModel)]="estate.adress" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Distrito</mat-label>
    <input matInput name="district" [(ngModel)]="estate.district" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Ciudad</mat-label>
    <input matInput name="city" [(ngModel)]="estate.city" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Precio mensual</mat-label>
    <input matInput type="number" name="monthlyPrice" [(ngModel)]="estate.monthlyPrice" required min="1" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Tipo</mat-label>
    <input matInput name="type" [(ngModel)]="estate.type" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Estado</mat-label>
    <mat-select name="state" [(ngModel)]="estate.state" required>
      <mat-option [value]="true">Disponible</mat-option>
      <mat-option [value]="false">No disponible</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Habitaciones</mat-label>
    <input matInput type="number" name="rooms" [(ngModel)]="estate.rooms" required min="1" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Baños</mat-label>
    <input matInput type="number" name="bathrooms" [(ngModel)]="estate.bathrooms" required min="1" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Área m2</mat-label>
    <input matInput type="number" name="areaM2" [(ngModel)]="estate.areaM2" required min="1" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Fecha de creación</mat-label>
    <input matInput type="date" name="creationDate" [(ngModel)]="estate.creationDate" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>ID usuario</mat-label>
    <input matInput type="number" name="idUser" [(ngModel)]="estate.idUser" required min="1" />
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit" [disabled]="estateForm.invalid">
    <mat-icon>save</mat-icon>
    Actualizar
  </button>

  <button mat-button type="button" (click)="cancelar()">Cancelar</button>
</form>
