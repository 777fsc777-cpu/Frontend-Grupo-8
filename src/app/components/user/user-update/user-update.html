<h1>Actualizar usuario</h1>

<form #userForm="ngForm" (ngSubmit)="aceptar()">
  <mat-form-field appearance="outline">
    <mat-label>Nombre</mat-label>
    <input matInput name="name" [(ngModel)]="user.name" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Apellido</mat-label>
    <input matInput name="lastName" [(ngModel)]="user.lastName" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>DNI</mat-label>
    <input matInput type="number" name="dni" [(ngModel)]="user.dni" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Usuario</mat-label>
    <input matInput name="username" [(ngModel)]="user.username" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Nueva contraseña</mat-label>
    <input matInput type="password" name="password" [(ngModel)]="user.password" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Foto de perfil</mat-label>
    <input matInput name="profilePhoto" [(ngModel)]="user.profilePhoto" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Teléfono</mat-label>
    <input matInput name="phoneNumber" [(ngModel)]="user.phoneNumber" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Fecha de creación</mat-label>
    <input matInput type="date" name="createdDate" [(ngModel)]="user.createdDate" required readonly />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Fecha de actualización</mat-label>
    <input matInput type="date" name="updateDate" [(ngModel)]="user.updateDate" required readonly />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Verificado</mat-label>
    <mat-select name="statusVerification" [(ngModel)]="user.statusVerification" required>
      <mat-option [value]="true">Sí</mat-option>
      <mat-option [value]="false">No</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Habilitado</mat-label>
    <mat-select name="enabled" [(ngModel)]="user.enabled" required>
      <mat-option [value]="true">Sí</mat-option>
      <mat-option [value]="false">No</mat-option>
    </mat-select>
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit" [disabled]="userForm.invalid">
    <mat-icon>save</mat-icon>
    Actualizar
  </button>

  <button mat-button type="button" (click)="cancelar()">Cancelar</button>
</form>
