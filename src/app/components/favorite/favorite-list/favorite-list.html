<h1>Lista de favoritos</h1>

<button mat-raised-button color="primary" routerLink="/favorites/register">
  <mat-icon>add</mat-icon>
  Registrar favorito
</button>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  <ng-container matColumnDef="c1">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let element">{{ element.idFavorite }}</td>
  </ng-container>

  <ng-container matColumnDef="c2">
    <th mat-header-cell *matHeaderCellDef>Fecha</th>
    <td mat-cell *matCellDef="let element">{{ element.creationDate | date:'dd/MM/yyyy' }}</td>
  </ng-container>

  <ng-container matColumnDef="c3">
    <th mat-header-cell *matHeaderCellDef>ID usuario</th>
    <td mat-cell *matCellDef="let element">{{ element.user?.idUser }}</td>
  </ng-container>

  <ng-container matColumnDef="c4">
    <th mat-header-cell *matHeaderCellDef>ID inmueble</th>
    <td mat-cell *matCellDef="let element">{{ element.estate?.idEstate }}</td>
  </ng-container>

  <ng-container matColumnDef="c5">
    <th mat-header-cell *matHeaderCellDef>Inmueble</th>
    <td mat-cell *matCellDef="let element">{{ element.estate?.title }}</td>
  </ng-container>

  <ng-container matColumnDef="c6">
    <th mat-header-cell *matHeaderCellDef>Editar</th>
    <td mat-cell *matCellDef="let element">
      <button mat-icon-button color="primary" [routerLink]="['/favorites/edit', element.idFavorite]">
        <mat-icon>edit</mat-icon>
      </button>
    </td>
  </ng-container>

  <ng-container matColumnDef="c7">
    <th mat-header-cell *matHeaderCellDef>Eliminar</th>
    <td mat-cell *matCellDef="let element">
      <button mat-icon-button color="warn" (click)="eliminar(element.idFavorite)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
