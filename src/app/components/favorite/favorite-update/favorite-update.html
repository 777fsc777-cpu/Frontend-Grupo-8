<h1>Actualizar favorito</h1>

<form #favoriteForm="ngForm" (ngSubmit)="save()">
  <mat-form-field appearance="outline">
    <mat-label>Fecha de creacion</mat-label>
    <input matInput type="date" name="creationDate" [(ngModel)]="favorite.creationDate" required readonly />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Usuario</mat-label>
    <mat-select name="idUser" [(ngModel)]="favorite.idUser" required>
      @for (user of users; track user.idUser) {
        <mat-option [value]="user.idUser">{{ user.name }} {{ user.lastName }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Inmueble</mat-label>
    <mat-select name="idEstate" [(ngModel)]="favorite.idEstate" required>
      @for (estate of estates; track estate.idEstate) {
        <mat-option [value]="estate.idEstate">{{ estate.title }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit" [disabled]="favoriteForm.invalid">
    <mat-icon>save</mat-icon>
    Actualizar
  </button>

  <button mat-button type="button" (click)="cancel()">Cancelar</button>
</form>
