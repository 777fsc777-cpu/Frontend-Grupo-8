<h1>Actualizar punto de riesgo</h1>

<form #riskPointForm="ngForm" (ngSubmit)="aceptar()">
  <mat-form-field appearance="outline">
    <mat-label>Descripción</mat-label>
    <textarea matInput name="description" [(ngModel)]="riskPoint.description" required></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Coordenada X</mat-label>
    <input matInput type="number" name="cordX" [(ngModel)]="riskPoint.cordX" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Coordenada Y</mat-label>
    <input matInput type="number" name="cordY" [(ngModel)]="riskPoint.cordY" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Coordenada Z</mat-label>
    <input matInput type="number" name="cordZ" [(ngModel)]="riskPoint.cordZ" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Severidad</mat-label>
    <input matInput name="severity" [(ngModel)]="riskPoint.severity" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>ID modelo 3D</mat-label>
    <input matInput type="number" name="idModel3D" [(ngModel)]="riskPoint.idModel3D" required min="1" />
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit" [disabled]="riskPointForm.invalid">
    <mat-icon>save</mat-icon>
    Actualizar
  </button>

  <button mat-button type="button" (click)="cancelar()">Cancelar</button>
</form>
