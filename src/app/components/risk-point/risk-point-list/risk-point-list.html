<h1>Lista de puntos de riesgo</h1>

<button mat-raised-button color="primary" routerLink="/risk-points/register">
  <mat-icon>add</mat-icon>
  Registrar punto
</button>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  <ng-container matColumnDef="c1">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let element">{{ element.id }}</td>
  </ng-container>

  <ng-container matColumnDef="c2">
    <th mat-header-cell *matHeaderCellDef>Descripción</th>
    <td mat-cell *matCellDef="let element">{{ element.description }}</td>
  </ng-container>

  <ng-container matColumnDef="c3">
    <th mat-header-cell *matHeaderCellDef>X</th>
    <td mat-cell *matCellDef="let element">{{ element.cordX }}</td>
  </ng-container>

  <ng-container matColumnDef="c4">
    <th mat-header-cell *matHeaderCellDef>Y</th>
    <td mat-cell *matCellDef="let element">{{ element.cordY }}</td>
  </ng-container>

  <ng-container matColumnDef="c5">
    <th mat-header-cell *matHeaderCellDef>Z</th>
    <td mat-cell *matCellDef="let element">{{ element.cordZ }}</td>
  </ng-container>

  <ng-container matColumnDef="c6">
    <th mat-header-cell *matHeaderCellDef>Severidad</th>
    <td mat-cell *matCellDef="let element">{{ element.severity }}</td>
  </ng-container>

  <ng-container matColumnDef="c7">
    <th mat-header-cell *matHeaderCellDef>Editar</th>
    <td mat-cell *matCellDef="let element">
      <button mat-icon-button color="primary" [routerLink]="['/risk-points/edit', element.id]">
        <mat-icon>edit</mat-icon>
      </button>
    </td>
  </ng-container>

  <ng-container matColumnDef="c8">
    <th mat-header-cell *matHeaderCellDef>Eliminar</th>
    <td mat-cell *matCellDef="let element">
      <button mat-icon-button color="warn" (click)="eliminar(element.id)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
