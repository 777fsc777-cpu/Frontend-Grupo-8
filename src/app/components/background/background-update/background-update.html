<h1>Actualizar antecedente</h1>

<form #backgroundForm="ngForm" (ngSubmit)="aceptar()">
  <mat-form-field appearance="outline">
    <mat-label>Tipo</mat-label>
    <input matInput name="type" [(ngModel)]="background.type" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Descripción</mat-label>
    <textarea matInput name="description" [(ngModel)]="background.description" required></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Fuente</mat-label>
    <input matInput name="source" [(ngModel)]="background.source" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Fecha de registro</mat-label>
    <input matInput type="date" name="registrationDate" [(ngModel)]="background.registrationDate" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>ID usuario</mat-label>
    <input matInput type="number" name="idUser" [(ngModel)]="background.idUser" required min="1" />
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit" [disabled]="backgroundForm.invalid">
    <mat-icon>save</mat-icon>
    Actualizar
  </button>

  <button mat-button type="button" (click)="cancelar()">Cancelar</button>
</form>
