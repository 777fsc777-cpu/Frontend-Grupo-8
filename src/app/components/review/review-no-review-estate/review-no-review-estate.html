<section class="card-list-page">
  <header class="list-header">
    <div>
      <p>Resenas</p>
      <h1>Inmuebles sin resenas</h1>
    </div>
  </header>

  <div class="entity-grid">
    @for (element of inmuebles; track element.idEstate) {
      <mat-card class="entity-card">
        <mat-card-header>
          <mat-icon mat-card-avatar>hide_source</mat-icon>
          <mat-card-title>{{ element.title }}</mat-card-title>
          <mat-card-subtitle>{{ element.city }}</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
          <dl>
            <div><dt>Precio mensual</dt><dd>{{ element.monthlyPrice | currency }}</dd></div>
            <div><dt>ID inmueble</dt><dd>{{ element.idEstate }}</dd></div>
          </dl>
        </mat-card-content>
      </mat-card>
    } @empty {
      <mat-card class="empty-card">
        <mat-icon>inbox</mat-icon>
        <span>Todos los inmuebles tienen resenas.</span>
      </mat-card>
    }
  </div>
</section>
