<h1>Actualizar modelo 3D</h1>

<form #model3dForm="ngForm" (ngSubmit)="aceptar()">
  <mat-form-field appearance="outline">
    <mat-label>Archivo URL</mat-label>
    <input matInput name="fileURL" [(ngModel)]="model3d.fileURL" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Estado</mat-label>
    <input matInput name="state" [(ngModel)]="model3d.state" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Fecha de creación</mat-label>
    <input matInput type="date" name="createDate" [(ngModel)]="model3d.createDate" required readonly />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>ID inmueble</mat-label>
    <input matInput type="number" name="idEstate" [(ngModel)]="model3d.idEstate" required min="1" />
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit" [disabled]="model3dForm.invalid">
    <mat-icon>save</mat-icon>
    Actualizar
  </button>

  <button mat-button type="button" (click)="cancelar()">Cancelar</button>
</form>
