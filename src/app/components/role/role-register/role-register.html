<h1>Registrar rol</h1>

<form #roleForm="ngForm" (ngSubmit)="aceptar()">
  <mat-form-field appearance="outline">
    <mat-label>Rol</mat-label>
    <mat-select name="rol" [(ngModel)]="role.rol" required #direccionInput="ngModel" required>
        @if (direccionInput.invalid && direccionInput.touched) {
          <mat-error>Este campo es requerido</mat-error>
        }
      <mat-option value="Administrador">Administrador</mat-option>
      <mat-option value="arrendatario">Arrendatorio</mat-option>
      <mat-option value="arrendador">Arrendador</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>ID usuario</mat-label>
    <input matInput type="number" name="idUser" [(ngModel)]="role.idUser" required min="1" />
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit" [disabled]="roleForm.invalid">
    <mat-icon>save</mat-icon>
    Guardar
  </button>

  <button mat-button type="button" (click)="cancelar()">Cancelar</button>
</form>
