<h1>Actualizar notificación</h1>

<form #notificationForm="ngForm" (ngSubmit)="aceptar()">
  <mat-form-field appearance="outline">
    <mat-label>Título</mat-label>
    <input matInput name="title" [(ngModel)]="notification.title" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Mensaje</mat-label>
    <textarea matInput name="message" [(ngModel)]="notification.message" required></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Tipo</mat-label>
    <input matInput name="type" [(ngModel)]="notification.type" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Leída</mat-label>
    <mat-select name="read" [(ngModel)]="notification.read" required>
      <mat-option [value]="true">Sí</mat-option>
      <mat-option [value]="false">No</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Fecha de creación</mat-label>
    <input matInput type="date" name="createdDate" [(ngModel)]="notification.createdDate" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>ID usuario</mat-label>
    <input matInput type="number" name="idUser" [(ngModel)]="notification.idUser" required min="1" />
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit" [disabled]="notificationForm.invalid">
    <mat-icon>save</mat-icon>
    Actualizar
  </button>

  <button mat-button type="button" (click)="cancelar()">Cancelar</button>
</form>
