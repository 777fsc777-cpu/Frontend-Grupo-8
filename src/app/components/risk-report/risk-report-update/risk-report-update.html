<h1>Actualizar reporte de riesgo</h1>

<form #riskReportForm="ngForm" (ngSubmit)="aceptar()">
  <mat-form-field appearance="outline">
    <mat-label>Tipo</mat-label>
    <input matInput name="type" [(ngModel)]="riskReport.type" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Fecha de creación</mat-label>
    <input matInput type="date" name="creationDate" [(ngModel)]="riskReport.creationDate" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Nivel de riesgo</mat-label>
    <input matInput name="riskLevel" [(ngModel)]="riskReport.riskLevel" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Descripción</mat-label>
    <textarea matInput name="description" [(ngModel)]="riskReport.description" required></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Detalles</mat-label>
    <textarea matInput name="details" [(ngModel)]="riskReport.details" required></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>ID usuario</mat-label>
    <input matInput type="number" name="idUser" [(ngModel)]="riskReport.idUser" required min="1" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>ID inmueble</mat-label>
    <input matInput type="number" name="idEstate" [(ngModel)]="riskReport.idEstate" required min="1" />
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit" [disabled]="riskReportForm.invalid">
    <mat-icon>save</mat-icon>
    Actualizar
  </button>

  <button mat-button type="button" (click)="cancelar()">Cancelar</button>
</form>
