<h1>Registrar mensaje</h1>

<form #messageForm="ngForm" (ngSubmit)="aceptar()">
  <mat-form-field appearance="outline">
    <mat-label>Contenido</mat-label>
    <textarea matInput name="content" [(ngModel)]="message.content" required></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Estado</mat-label>
    <input matInput name="status" [(ngModel)]="message.status" required />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Fecha enviada</mat-label>
    <input matInput type="date" name="dateSent" [(ngModel)]="message.dateSent" required readonly />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>ID conversación</mat-label>
    <input matInput type="number" name="idConversation" [(ngModel)]="message.idConversation" required min="1" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>ID usuario</mat-label>
    <input matInput type="number" name="idUser" [(ngModel)]="message.idUser" required min="1" />
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit" [disabled]="messageForm.invalid">
    <mat-icon>save</mat-icon>
    Guardar
  </button>

  <button mat-button type="button" (click)="cancelar()">Cancelar</button>
</form>
