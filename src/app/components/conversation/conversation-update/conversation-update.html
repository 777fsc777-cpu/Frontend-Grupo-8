<h1>Actualizar conversación</h1>

<form #conversationForm="ngForm" (ngSubmit)="aceptar()">
  <mat-form-field appearance="outline">
    <mat-label>ID usuario 1</mat-label>
    <input matInput type="number" name="idUser1" [(ngModel)]="conversation.idUser1" required min="1" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>ID usuario 2</mat-label>
    <input matInput type="number" name="idUser2" [(ngModel)]="conversation.idUser2" required min="1" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>ID inmueble</mat-label>
    <input matInput type="number" name="idEstate" [(ngModel)]="conversation.idEstate" required min="1" />
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit" [disabled]="conversationForm.invalid">
    <mat-icon>save</mat-icon>
    Actualizar
  </button>

  <button mat-button type="button" (click)="cancelar()">Cancelar</button>
</form>
